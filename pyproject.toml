[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-vacuity"
dynamic = ["version"]
description = "Find Foundry invariant tests that pass for the wrong reason."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "keldxd"}]
keywords = ["foundry", "solidity", "invariant", "fuzzing", "security", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/keldxd/invariant-vacuity"

[project.scripts]
vacuity = "vacuity.cli:main"

[tool.setuptools]
packages = ["vacuity"]

[tool.setuptools.package-data]
vacuity = ["vm_signatures.txt"]

[tool.setuptools.dynamic]
version = {attr = "vacuity.__version__"}
